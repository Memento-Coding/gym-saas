# Frontend CI/CD
#   cualquier rama / PR → test + build
#   push a develop      → deploy a dev  (S3 + CloudFront de GymOps-dev-Storage)
#   push a master       → deploy a prod, solo si es idéntico a develop y develop ya se desplegó en dev
#
# Bucket y DistributionId se leen de los outputs del stack CDK (gym-saas-infra),
# así no hay que duplicarlos en secrets.
name: Frontend

on:
  push:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read # gate de prod: consultar runs de develop
  id-token: write # AWS OIDC

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22" # Node 26 rompe el localStorage de jsdom en vitest
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - run: npm run build # sin VITE_* de un ambiente: solo valida que compila
      # docs/STEERING_TESTING.md: sin escenarios adversarios no se integra.
      - run: node --test scripts/check-test-standard.test.mjs
      - run: node scripts/check-test-standard.mjs

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx bddgen && npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  deploy:
    needs: [build, e2e]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/master' && 'production' || 'dev' }}
    concurrency:
      group: frontend-deploy-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      STACK: GymOps-${{ github.ref == 'refs/heads/master' && 'prod' || 'dev' }}-Storage
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Prod solo despliega lo que ya pasó por dev (no hay revisores obligatorios sin GitHub Team).
      - name: Gate - mismo código que develop y desplegado en dev
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet origin/develop HEAD || { echo "::error::master difiere de develop: mergea a develop y deja que se despliegue en dev primero"; exit 1; }
          sha=$(git rev-parse origin/develop)
          ok=$(gh run list --workflow frontend.yml --branch develop --commit "$sha" --status success --json databaseId -q length)
          [ "$ok" -gt 0 ] || { echo "::error::develop ($sha) no se ha desplegado con éxito en dev"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      # Vite incrusta las VITE_* en el bundle al compilar: vienen de las
      # variables del GitHub Environment (dev / production).
      - name: Build
        run: npm run build
        env:
          VITE_API_MODE: ${{ vars.VITE_API_MODE }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_AUTH_BYPASS: "false"
          VITE_COGNITO_USER_POOL_ID: ${{ vars.VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}
          VITE_COGNITO_REGION: ${{ vars.VITE_COGNITO_REGION }}
          VITE_COGNITO_OAUTH_DOMAIN: ${{ vars.VITE_COGNITO_OAUTH_DOMAIN }}
          VITE_COGNITO_REDIRECT_SIGN_IN: ${{ vars.VITE_COGNITO_REDIRECT_SIGN_IN }}
          VITE_COGNITO_REDIRECT_SIGN_OUT: ${{ vars.VITE_COGNITO_REDIRECT_SIGN_OUT }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_FRONTEND_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve bucket and distribution from CDK outputs
        run: |
          out() { aws cloudformation describe-stacks --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          echo "BUCKET=$(out FrontendBucketName)" >> "$GITHUB_ENV"
          echo "DIST_ID=$(out DistributionId)" >> "$GITHUB_ENV"

      # Assets con hash → caché larga; index.html sin caché para que el deploy se vea al instante.
      - name: Upload to S3
        run: |
          aws s3 sync dist/ "s3://$BUCKET" --delete --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
